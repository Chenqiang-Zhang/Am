# ジャンル設定ファイル
# ここを変えるだけで別の Amazon カテゴリに対応できる。
# スキーマ・コード・Cypher クエリは変えない。

genre: "Video_Games"

# ---- データパス ----
data:
  review_path: "data/Video_Games.jsonl.gz"
  meta_path:   "data/meta_Video_Games.jsonl.gz"
  output_dir:  "kg_output/video_games"

# ---- データ規模 ----
# 商品・ユーザーの選定は select_kcore.py が確定する k-core
# （<output_dir>/kcore_selection、全ユーザー・全商品が最低k件の相互作用を持つ）に一本化。
# k の値は select_kcore.py の --k で指定する（デフォルト14。Video_Games規模で検証済みの値
# — users=861 / items=610 / edges=18,771。select_kcore.pyはデフォルトでprice/avg_rating/
# rating_count/description/brand/categoryのいずれかが欠損している商品を先に除外してから
# k-coreを計算する（--allow-incomplete-metadataで無効化可）。ジャンルを変えたら k は要再検証、
# select_kcore.py --k <値> を何度か振って規模を確認してから決める）。
scale:
  min_feature_len: 8

# ---- LLM 設定（属性抽出・Text2Cypher 共通） ----
# attr_type は LLM が自由に定義する（ジャンル非依存）。
# snake_case・既存の型を再利用するようプロンプトで指示し、後処理で正規化する。
llm:
  provider: "deepseek"            # gemini / groq / deepseek / openai
  model:   # 省略時はプロバイダのデフォルト
  attr_type_normalize: true       # 抽出後に snake_case 正規化を行うか
  min_confidence: 0.6             # この値未満の Attribute は除外
  min_review_text_len: 30         # MENTIONS 抽出対象の最小文字数

# ---- Neo4j 接続 ----
# URI・パスワードは Am/.env に書く（このファイルには書かない）
# → Am/.env.example を参照

# ---- API サーバ ----
api:
  host: "0.0.0.0"
  port: 8000
  recommend_limit_default: 10
  recommend_limit_max: 50

# ---- Text2Cypher ----
text2cypher:
  max_cypher_attempts: 3   # Cypher 生成失敗時の最大リトライ回数
  candidate_limit: 20      # Cypher の LIMIT デフォルト値
